name: Update Solarvest monitor

# Schedule turned off on 28 Oct 2026: the Claude scheduled tasks are the single updater
# (they also keep the Claude dashboard in sync). Running both at :37 would write duplicate
# rows and clash on pushes. This workflow can still be run manually from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "intraday or evening"
        default: intraday
      dry_run:
        description: "true = print only, don't commit"
        default: "false"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3 beautifulsoup4==4.12.3
      - name: Run update and push (retries if the Claude check pushed at the same time)
        env:
          MODE: ${{ github.event_name == 'schedule' && 'intraday' || inputs.mode }}
          DRY: ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898469+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main && git reset --hard origin/main
            python scripts/update.py "$MODE" $DRY
            if [ -n "$DRY" ]; then exit 0; fi
            git add data/
            if git diff --cached --quiet; then echo "No changes"; exit 0; fi
            git commit -m "Auto update $(TZ=Asia/Kuala_Lumpur date '+%Y-%m-%d %H:%M') MYT"
            if git push origin HEAD:main; then exit 0; fi
            echo "Push rejected, retrying"; sleep 20
          done
          exit 1
