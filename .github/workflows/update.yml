name: Update Solarvest monitor

# Intraday updater for the public website, every 15 minutes on weekdays from 9:07am to 5:07pm MYT
# (times below are UTC). It skips :37, when the Claude hourly check runs (that check also keeps the
# Claude dashboard in sync). It writes data/status.json every run, adds new announcements, and adds a
# check row only on a ±5% intraday move (at most once an hour). Intraday runs never write prices;
# the 5:45pm MYT run records the day's close only if it is still missing.
# GitHub may start scheduled runs a few minutes late. It can also be run manually from the Actions tab.
on:
  schedule:
    - cron: "7,22,52 1-8 * * 1-5"
    - cron: "7 9 * * 1-5"
    # End-of-day backstop at 5:45pm MYT: records today's close if the Claude close check hasn't.
    - cron: "45 9 * * 1-5"
  workflow_dispatch:
    inputs:
      mode:
        description: "intraday or evening"
        default: intraday
      dry_run:
        description: "true = print only, don't commit"
        default: "false"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3 beautifulsoup4==4.12.3
      - name: Run update and push (retries if the Claude check pushed at the same time)
        env:
          MODE: ${{ github.event_name == 'schedule' && (github.event.schedule == '45 9 * * 1-5' && 'evening' || 'intraday') || inputs.mode }}
          DRY: ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898469+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main && git reset --hard origin/main
            python scripts/update.py "$MODE" $DRY
            if [ -n "$DRY" ]; then exit 0; fi
            git add data/
            if git diff --cached --quiet; then echo "No changes"; exit 0; fi
            git commit -m "Auto update $(TZ=Asia/Kuala_Lumpur date '+%Y-%m-%d %H:%M') MYT"
            if git push origin HEAD:main; then exit 0; fi
            echo "Push rejected, retrying"; sleep 20
          done
          exit 1
