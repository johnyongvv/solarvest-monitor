name: Update Solarvest monitor

# Schedule turned off on 28 Oct 2026: the Claude scheduled tasks are the single updater
# (they also keep the Claude dashboard in sync). Running both at :37 would write duplicate
# rows and clash on pushes. This workflow can still be run manually from the Actions tab.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "intraday or evening"
        default: intraday
      dry_run:
        description: "true = print only, don't commit"
        default: "false"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests==2.32.3 beautifulsoup4==4.12.3
      - name: Run update
        env:
          MODE: ${{ github.event_name == 'schedule' && (github.event.schedule == '37 11 * * 1-5' && 'evening' || 'intraday') || inputs.mode }}
          DRY: ${{ inputs.dry_run == 'true' && '--dry-run' || '' }}
        run: python scripts/update.py "$MODE" $DRY
      - name: Commit changes
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898469+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Auto update $(TZ=Asia/Kuala_Lumpur date '+%Y-%m-%d %H:%M') MYT"
          git pull --rebase origin main
          git push origin main
